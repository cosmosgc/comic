; PHP upload limits for the hosting provider.
; This file is read automatically for scripts under public/ (no console needed).
; Deploy it via FTP next to public/index.php. Keep in sync with:
;   config/upload.php (app-level checks) and nginx client_max_body_size.
upload_max_filesize = 100M
post_max_size = 110M
max_file_uploads = 200
max_execution_time = 300
max_input_time = 300
